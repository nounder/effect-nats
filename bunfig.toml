[fmt]
printWidth = 100
tabWidth = 2
useTabs = false
semi = false
singleQuote = false
jsxSingleQuote = false
trailingComma = "all"
arrowParens = "always"
endOfLine = "lf"
singleAttributePerLine = true
sortImports = { newlinesBetween = false }
sortPackageJson = true
jsdoc = true
ignorePatterns = [
  ".agents/**",
  ".build/**",
  "dist/**",
  "pad/**",
  "**/node_modules",
  "**/*-lock.json",
  "vscode/*.json",
]

[lint]
typeAware = false
ignorePatterns = [".agents/", ".build/", "dist/"]

[lint.categories]
correctness = "error"

[lint.rules]
"eslint/no-console" = "warn"
"import/no-default-export" = "error"
# Subscription cleanup iterates snapshots while mutating the underlying map.
"unicorn/no-useless-spread" = "off"

[[lint.overrides]]
files = ["bench/**"]
rules = { "eslint/no-console" = "off" }
